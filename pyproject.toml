[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-evalkit"
version = "0.1.0"
description = "Benchmark MuscleMimic policy kinematics, kinetics, and neuromuscular behavior against human data"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "MuscleMimic Team"}]
keywords = [
  "biomechanics",
  "benchmarking",
  "electromyography",
  "kinematics",
  "kinetics",
  "musculoskeletal simulation",
  "neuromuscular behavior",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.8",
  "mujoco>=3.3",
  "musclemimic-models>=1.0.2",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
render = [
  "imageio-ffmpeg>=0.6",
  "opencv-python>=4.10",
]
dev = [
  "build>=1.2",
  "imageio-ffmpeg>=0.6",
  "opencv-python>=4.10",
  "pre-commit>=3.8,<4",
  "pytest>=8",
  "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/amathislab/mm-evalkit"
Repository = "https://github.com/amathislab/mm-evalkit"
Issues = "https://github.com/amathislab/mm-evalkit/issues"
Preprint = "https://arxiv.org/abs/2603.25544"

[project.scripts]
mm-evalkit = "mm_evalkit.cli:main"

[project.entry-points."mm_evalkit.datasets"]
gait120 = "mm_evalkit.workflows.gait:gait120_main"
wang = "mm_evalkit.workflows.gait:wang_main"
ultra-mocap = "mm_evalkit.workflows.bimanual:main"

[project.entry-points."mm_evalkit.renderers"]
gait120 = "mm_evalkit.workflows.gait.render:prepare_clip"
ultra-mocap = "mm_evalkit.workflows.bimanual.render:prepare_clip"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite mirrors the package, so module basenames repeat across directories
# and the root package name is shared with the parent repository's suite.
# importlib import mode keys each test module by its full path instead.
addopts = "--import-mode=importlib"
consider_namespace_packages = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "DTZ", "RUF"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
# Public keyword retained verbatim for constructor compatibility.
"**/workflows/gait/analysis.py" = ["N803"]

[tool.ruff.lint.isort]
known-first-party = ["mm_evalkit"]
